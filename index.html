// Audio context for simple sounds
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, duration, type='sine') {
  if (!soundEnabled || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.value = freq;
  osc.type = type;
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

const expressions = {

// ==================== EMOTIONALLY INTELLIGENT COMMUNICATION ====================
const SUPPORT_MODES = {
  listening: "listening",
  comfort: "comfort",
  reflection: "reflection",
  problemSolving: "problem-solving",
  calming: "calming",
  general: "general"
};

const EMOTION_CUES = {
  happiness: /\b(happy|glad|great|awesome|love|yay|wonderful|excited|thrilled)\b/i,
  frustration: /\b(frustrated|annoyed|stuck|ugh|tired of|annoying|irritated)\b/i,
  disappointment: /\b(disappointed|let down|bummed|hoped|expected more)\b/i,
  loneliness: /\b(lonely|alone|left out|nobody|isolated)\b/i,
  uncertainty: /\b(confused|not sure|don't know|unsure|maybe|unclear)\b/i,
  stress: /\b(stressed|overwhelmed|too much|anxious|worried|pressure)\b/i,
  boredom: /\b(bored|nothing to do|dull|boring)\b/i,
  tired: /\b(tired|exhausted|sleepy|worn out)\b/i,
  excitement: /\b(excited|can't wait|pumped|looking forward)\b/i
};

let justListenMode = false;
let lastEmotion = null;
let lastMode = null;
let lastReplyTime = 0;

function estimateEmotion(text) {
  const lower = String(text || "").toLowerCase();
  for (const [label, pattern] of Object.entries(EMOTION_CUES)) {
    if (pattern.test(lower)) return { label, uncertain: true };
  }
  return { label: "neutral", uncertain: true };
}

function selectMode(text, emotion) {
  if (justListenMode) return SUPPORT_MODES.listening;
  const t = String(text || "").toLowerCase();
  if (/\b(just vent|just listen|don't give advice|don't suggest|no advice)\b/i.test(t)) {
    justListenMode = true;
    return SUPPORT_MODES.listening;
  }
  if (/\b(help me calm|relax|overwhelmed right now|breathe)\b/i.test(t)) return SUPPORT_MODES.calming;
  if (/\b(what should i do|advice|how can i|suggestions)\b/i.test(t)) return SUPPORT_MODES.problemSolving;
  if (emotion.label === "loneliness" || emotion.label === "disappointment" || emotion.label === "sadness") return SUPPORT_MODES.comfort;
  if (/\b(why do i|help me understand|figure out)\b/i.test(t)) return SUPPORT_MODES.reflection;
  return SUPPORT_MODES.general;
}

function generateSupportiveReply(userText, emotion, mode) {
  const e = emotion.label;
  const variations = {
    listening: [
      "I’m here. Take your time — I’m just listening.",
      "Go ahead, I’m listening. No pressure to figure anything out.",
      "I’m right here with you. Say whatever you need to."
    ],
    comfort: {
      loneliness: ["It can feel really quiet when you want someone around. I’m glad you told me.", "Feeling left out or alone is tough. You’re not bothering me by sharing this."],
      disappointment: ["That sounds disappointing. It’s okay to feel let down by that.", "I get why that would feel like a letdown. Want to sit with it for a bit?"],
      default: ["That sounds tough. I’m right here with you.", "I’m sorry it’s been heavy. You can keep talking if you want."]
    },
    calming: [
      "Want to try something small? You could notice three things you can see right now, or just take one slow breath if that feels okay. No pressure.",
      "If it helps, you can feel your feet on the floor for a moment. Or we can just stay quiet. Whatever works."
    ],
    problemSolving: [
      "We can think through a couple of small next steps if you want. What feels most doable right now?",
      "Want to look at one tiny thing you could do next, or just keep talking about it first?"
    ],
    reflection: [
      "What part of this has been on your mind the most?",
      "Has this been building for a while, or did something specific happen today?"
    ],
    general: {
      happiness: ["That’s nice to hear! What’s been making things feel good?", "I’m glad something feels good right now. Want to tell me more?"],
      frustration: ["Ugh, that sounds frustrating. Want to say more about what’s sticking?", "Yeah, that kind of thing can really get under your skin."],
      uncertainty: ["It’s okay not to have it all figured out. What’s the unclear part?", "Not knowing is uncomfortable. What feels the most confusing?"],
      boredom: ["Sounds like things feel a bit slow. Anything you’ve been wanting to do?", "Boredom can be weird. Want to just hang out or talk about something else?"],
      tired: ["You sound worn out. Want to rest for a bit or keep chatting quietly?", "Tired days are real. No need to push yourself here."],
      excitement: ["Oh, that sounds fun! What’s got you looking forward to it?", "I like hearing when something feels exciting. Tell me more?"],
      default: ["I’m listening. What’s on your mind?", "Got it. Want to keep going?"]
    }
  };

  if (mode === SUPPORT_MODES.listening) return variations.listening[Math.floor(Math.random() * variations.listening.length)];
  if (mode === SUPPORT_MODES.comfort) {
    const list = variations.comfort[e] || variations.comfort.default;
    return list[Math.floor(Math.random() * list.length)];
  }
  if (mode === SUPPORT_MODES.calming) return variations.calming[Math.floor(Math.random() * variations.calming.length)];
  if (mode === SUPPORT_MODES.problemSolving) return variations.problemSolving[Math.floor(Math.random() * variations.problemSolving.length)];
  if (mode === SUPPORT_MODES.reflection) return variations.reflection[Math.floor(Math.random() * variations.reflection.length)];

  const gen = variations.general[e] || variations.general.default;
  let reply = gen[Math.floor(Math.random() * gen.length)];

  // Light follow-up if recent
  if (lastEmotion && lastMode && (Date.now() - lastReplyTime < 120000)) {
    if (Math.random() < 0.4) {
      reply = "Still on that earlier feeling? " + reply;
    }
  }
  return reply;
}

function emotionToExpression(label) {
  const map = {
    happiness: "happy",
    excitement: "happy",
    frustration: "confused",
    disappointment: "sad",
    loneliness: "sad",
    uncertainty: "thinking",
    stress: "thinking",
    boredom: "neutral",
    tired: "sleepy",
    neutral: "neutral"
  };
  return map[label] || "neutral";
}

function getEmotionAwareResponse(userInput) {
  const emotion = estimateEmotion(userInput);
  const mode = selectMode(userInput, emotion);
  const text = generateSupportiveReply(userInput, emotion, mode);
  lastEmotion = emotion;
  lastMode = mode;
  lastReplyTime = Date.now();
  return { text, emotion, mode };
}

function handleEmotionalInteraction(userText) {
  if (!userText || !userText.trim()) userText = "I wanted to share how I'm feeling";
  const result = getEmotionAwareResponse(userText);
  zimelia.expression = emotionToExpression(result.emotion.label);
  showDialogue(result.text, zimelia.expression);
}

function promptEmotionalShare() {
  const input = prompt("What would you like to share? (or leave blank for a general check-in)");
  handleEmotionalInteraction(input || "");
}

function toggleJustListen() {
  justListenMode = !justListenMode;
  const msg = justListenMode 
    ? "Okay, I’ll just listen for now. No suggestions unless you ask." 
    : "Got it — I’ll respond more normally again.";
  showDialogue(msg, "neutral");
}

// Lightweight test harness (call from console: runCommunicationTests())
function runCommunicationTests() {
  const tests = [
    { input: "I just need to vent, don't give advice", expectMode: "listening" },
    { input: "I feel really lonely today", expectMode: "comfort" },
    { input: "I'm so frustrated with this", expectEmotion: "frustration" },
    { input: "Help me calm down", expectMode: "calming" },
    { input: "What should I do about this?", expectMode: "problem-solving" },
    { input: "Why do I always feel this way?", expectMode: "reflection" },
    { input: "I'm excited about tomorrow!", expectEmotion: "excitement" },
    { input: "I'm just bored", expectEmotion: "boredom" }
  ];
  console.log("=== Communication Module Tests ===");
  tests.forEach((t, i) => {
    const r = getEmotionAwareResponse(t.input);
    const pass = (!t.expectMode || r.mode === t.expectMode) && (!t.expectEmotion || r.emotion.label === t.expectEmotion);
    console.log(`Test ${i+1}: ${pass ? "PASS" : "FAIL"} | Mode: ${r.mode} | Emotion: ${r.emotion.label} | Reply: ${r.text.slice(0,60)}...`);
  });
  console.log("Tests complete. (justListenMode reset for next run)");
  justListenMode = false;
}

// ==================== DIALOGUE SYSTEM ====================

function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function showDialogue(text, expression = 'neutral') {
  zimelia.expression = expression;
  document.getElementById('dialogueText').textContent = text;
  document.getElementById('dialogue').style.display = 'block';
  gameState = 'dialogue';
  updateChoices();
  drawPortrait();
  playTone(400, 0.1);
}

function updateChoices() {
  const choices = document.getElementById('choices');
  choices.innerHTML = '';
  const options = [
    {label: 'Talk', action: () => respond('greet', 'happy')},
    {label: 'How are you?', action: () => respond('feeling', 'thinking')},
    {label: 'What are you doing?', action: () => respond('doing', 'neutral')},
    {label: 'Tell me a joke', action: () => respond('joke', 'happy')},
    {label: 'Compliment', action: () => respond('compliment', 'embarrassed')},
    {label: 'About the house', action: () => respond('house', 'thinking')},
    {label: "I'm feeling down", action: () => respond('down', 'sad')},
    {label: 'Share how I feel', action: () => promptEmotionalShare()},
    {label: 'Just listen mode', action: () => toggleJustListen()},
    {label: 'Goodbye', action: () => { respond('goodbye', 'neutral'); setTimeout(closeDialogue, 1500); }}
  ];
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.textContent = opt.label;
    btn.onclick = opt.action;
    choices.appendChild(btn);
  });
}

function respond(type, expr) {
  showDialogue(getRandom(dialogues[type]), expr);
}

function closeDialogue() {
  document.getElementById('dialogue').style.display = 'none';
  gameState = 'playing';
}

// ==================== INTERACTIONS ====================
function interact() {
  if (gameState !== 'playing') return;
  // Check Zimelia first
  if (distance(player, zimelia) < 40) {
    showDialogue(getRandom(dialogues.greet), 'surprised');
    return;
  }
  // Check furniture
  for (let f of furniture) {
    if (Math.abs(player.x - (f.x + f.w/2)) < 30 && Math.abs(player.y - (f.y + f.h/2)) < 30) {
      handleObject(f);
      return;
    }
  }
}

function handleObject(obj) {
  playTone(300, 0.15);
  switch(obj.interact) {
    case 'sit':
      showMessage("You sit on the cozy sofa. It feels nice and soft.");
      if (Math.random() < 0.4) zimeliaComment("The sofa is the best spot, isn't it?");
      break;
    case 'bed':
      showMessage("You rest on the bed for a bit. Time passes...");
      gameTime += 120; // advance time
      updateTime();
      break;
    case 'computer':
      showMessage("The computer screen glows softly. Looks like a cozy desktop.");
      if (Math.random() < 0.5) zimeliaComment("Working on something interesting again?");
      break;
    case 'fridge':
      showMessage("Fridge contents: milk, fruits, leftovers. Everything looks fresh.");
      break;
    case 'tv':
      showMessage("You turn the TV on. A soft cartoon is playing.");
      break;
    case 'bookshelf':
      const books = ["A story about a girl and her cat exploring a forest.", "Tips for making the perfect cup of tea.", "Poems about rainy afternoons."];
      showMessage("You read: " + getRandom(books));
      break;
    case 'window':
      showMessage("Outside, the sky looks " + timeOfDay.toLowerCase() + ". Birds chirp softly.");
      break;
    case 'mirror':
      showMessage("You see your reflection. You look relaxed.");
      break;
    case 'door':
      showMessage("The front door. You could go outside, but it's cozy in here.");
      break;
    default:
      showMessage("A nice " + obj.name.toLowerCase() + ".");
  }
}

function showMessage(msg) {
  // Simple temporary message via dialogue style or alert for prototype
  const old = document.getElementById('dialogueText').textContent;
  document.getElementById('dialogueText').textContent = msg;
  document.getElementById('dialogue').style.display = 'block';
  document.getElementById('choices').innerHTML = '<button onclick="closeDialogue()">OK</button>';
  gameState = 'dialogue';
  setTimeout(() => { if (gameState === 'dialogue') closeDialogue(); }, 2500);
}

function zimeliaComment(text) {
  if (Date.now() - zimelia.lastComment < 10000) return;
  zimelia.lastComment = Date.now();
  setTimeout(() => {
    if (gameState === 'playing') {
      showDialogue(text, 'happy');
    }
  }, 800);
}

// ==================== ZIMELIA AI ====================
function updateZimelia(dt) {
  zimelia.actionTimer -= dt;
  if (zimelia.actionTimer <= 0) {
    chooseAction();
  }
  if (zimelia.state === 'walking' && zimelia.target) {
    const dx = zimelia.target.x - zimelia.x;
    const dy = zimelia.target.y - zimelia.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 5) {
      zimelia.x += (dx/dist) * zimelia.speed;
      zimelia.y += (dy/dist) * zimelia.speed;
      // simple collision check
      if (checkCollision(zimelia)) {
        zimelia.x -= (dx/dist) * zimelia.speed;
        zimelia.y -= (dy/dist) * zimelia.speed;
        chooseAction(); // stuck, new action
      }
    } else {
      zimelia.state = 'idle';
      zimelia.actionTimer = 2000 + Math.random()*3000;
    }
  }
  // Face player if close
  if (distance(player, zimelia) < 50) {
    zimelia.expression = 'happy';
  }
}

function chooseAction() {
  const actions = ['idle', 'walk', 'sit'];
  const act = actions[Math.floor(Math.random() * actions.length)];
  if (act === 'walk') {
    // pick a random valid point
    zimelia.target = {x: 100 + Math.random()*500, y: 100 + Math.random()*300};
    zimelia.state = 'walking';
    zimelia.actionTimer = 5000;
  } else if (act === 'sit') {
    zimelia.target = {x: 130, y: 130}; // near sofa
    zimelia.state = 'walking';
    zimelia.actionTimer = 8000;
    zimelia.expression = 'neutral';
  } else {
    zimelia.state = 'idle';
    zimelia.actionTimer = 3000 + Math.random()*4000;
    if (timeOfDay === 'Night') zimelia.expression = 'sleepy';
  }
}

// ==================== COLLISION & MOVEMENT ====================
function checkCollision(ent) {
  for (let c of collidables) {
    if (ent.x < c.x + c.w && ent.x + ent.w > c.x &&
        ent.y < c.y + c.h && ent.y + ent.h > c.y) {
      return true;
    }
  }
  // also with each other slightly
  if (ent !== zimelia && distance(ent, zimelia) < 20) return true;
  return false;
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function updatePlayer() {
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup'] || keys['up']) dy -= 1;
  if (keys['s'] || keys['arrowdown'] || keys['down']) dy += 1;
  if (keys['a'] || keys['arrowleft'] || keys['left']) dx -= 1;
  if (keys['d'] || keys['arrowright'] || keys['right']) dx += 1;
  if (dx !== 0 || dy !== 0) {
    const len = Math.sqrt(dx*dx + dy*dy);
    dx = (dx/len) * player.speed;
    dy = (dy/len) * player.speed;
    const oldX = player.x, oldY = player.y;
    player.x += dx;
    if (checkCollision(player)) player.x = oldX;
    player.y += dy;
    if (checkCollision(player)) player.y = oldY;
    if (soundEnabled && Math.random() < 0.1) playTone(200, 0.05, 'square');
  }
}

// ==================== TIME & ATMOSPHERE ====================
function updateTime() {
  gameTime = (gameTime + 0.5) % 1440; // slow advance
  const hour = Math.floor(gameTime / 60);
  if (hour >= 6 && hour < 12) timeOfDay = 'Morning';
  else if (hour >= 12 && hour < 17) timeOfDay = 'Afternoon';
  else if (hour >= 17 && hour < 20) timeOfDay = 'Evening';
  else timeOfDay = 'Night';
  document.getElementById('timeDisplay').textContent = timeOfDay + ' (' + hour + ':00)';
}

// ==================== RENDERING ====================
function drawHouse() {
  // Floor
  ctx.fillStyle = '#c4a484';
  ctx.fillRect(60, 60, 680, 480);
  // Room tints
  ctx.fillStyle = 'rgba(255,220,180,0.3)';
  ctx.fillRect(60, 60, 320, 220); // living
  ctx.fillStyle = 'rgba(200,180,150,0.3)';
  ctx.fillRect(390, 60, 350, 220); // kitchen
  ctx.fillStyle = 'rgba(180,160,200,0.3)';
  ctx.fillRect(60, 290, 340, 250); // bedroom

  // Walls
  ctx.fillStyle = '#5d4037';
  walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));

  // Furniture
  furniture.forEach(f => {
    ctx.fillStyle = f.color;
    ctx.fillRect(f.x, f.y, f.w, f.h);
    ctx.strokeStyle = '#3d2b1f';
    ctx.strokeRect(f.x, f.y, f.w, f.h);
    // simple details
    if (f.name === 'Sofa') {
      ctx.fillStyle = '#a0522d';
      ctx.fillRect(f.x+5, f.y+5, f.w-10, 8);
    }
    if (f.name === 'TV') {
      ctx.fillStyle = timeOfDay === 'Night' ? '#4488ff' : '#111';
      ctx.fillRect(f.x+5, f.y+5, f.w-10, f.h-10);
    }
  });

  // Lamps glow at night
  if (timeOfDay === 'Night' || timeOfDay === 'Evening') {
    ctx.fillStyle = 'rgba(255,200,100,0.15)';
    ctx.beginPath();
    ctx.arc(150, 140, 40, 0, Math.PI*2);
    ctx.arc(500, 120, 30, 0, Math.PI*2);
    ctx.fill();
  }

  // Night overlay
  if (timeOfDay === 'Night') {
    ctx.fillStyle = 'rgba(10,20,40,0.35)';
    ctx.fillRect(0,0,800,600);
  } else if (timeOfDay === 'Evening') {
    ctx.fillStyle = 'rgba(255,100,50,0.12)';
    ctx.fillRect(0,0,800,600);
  }
}

function drawCharacter(ent, isZimelia) {
  const {x, y} = ent;
  // Body
  ctx.fillStyle = isZimelia ? '#6b2d5c' : '#4a6fa5'; // purple jacket or blue shirt
  ctx.fillRect(x, y+8, 16, 12);
  // Head
  ctx.fillStyle = '#f5d0c5';
  ctx.fillRect(x+2, y, 12, 10);
  // Hair for Zimelia
  if (isZimelia) {
    ctx.fillStyle = '#2c1a12';
    ctx.fillRect(x+1, y-4, 14, 8); // long hair top
    ctx.fillRect(x, y+2, 3, 14); // side hair
    ctx.fillRect(x+13, y+2, 3, 14);
    // green hairpin
    ctx.fillStyle = '#3cb371';
    ctx.fillRect(x+10, y-2, 4, 3);
  } else {
    ctx.fillStyle = '#333';
    ctx.fillRect(x+3, y, 10, 4);
  }
  // Eyes based on expression (for Zimelia)
  if (isZimelia) {
    const exp = expressions[zimelia.expression] || expressions.neutral;
    ctx.fillStyle = '#000';
    if (exp.eyes === 'open' || exp.eyes === 'wide') {
      ctx.fillRect(x+4, y+3, 2, 2);
      ctx.fillRect(x+10, y+3, 2, 2);
      if (exp.eyes === 'wide') {
        ctx.fillRect(x+3, y+2, 4, 4);
        ctx.fillRect(x+9, y+2, 4, 4);
      }
    } else if (exp.eyes === 'half') {
      ctx.fillRect(x+4, y+4, 2, 1);
      ctx.fillRect(x+10, y+4, 2, 1);
    } else { // closed
      ctx.fillRect(x+4, y+4, 2, 1);
      ctx.fillRect(x+10, y+4, 2, 1);
    }
    // Mouth
    if (exp.mouth === 'smile') {
      ctx.fillRect(x+5, y+7, 6, 1);
      ctx.fillRect(x+6, y+8, 4, 1);
    } else if (exp.mouth === 'frown') {
      ctx.fillRect(x+5, y+8, 6, 1);
    } else if (exp.mouth === 'o') {
      ctx.fillRect(x+6, y+7, 4, 2);
    }
    // Blush
    if (exp.blush) {
      ctx.fillStyle = 'rgba(255,100,100,0.6)';
      ctx.fillRect(x+1, y+5, 3, 2);
      ctx.fillRect(x+12, y+5, 3, 2);
    }
  } else {
    ctx.fillStyle = '#000';
    ctx.fillRect(x+4, y+3, 2, 2);
    ctx.fillRect(x+10, y+3, 2, 2);
  }
}

function drawPortrait() {
  pctx.clearRect(0,0,64,64);
  // Simple face portrait
  pctx.fillStyle = '#f5d0c5';
  pctx.fillRect(16, 12, 32, 36);
  pctx.fillStyle = '#2c1a12';
  pctx.fillRect(12, 8, 40, 16); // hair
  pctx.fillStyle = '#3cb371';
  pctx.fillRect(40, 10, 8, 6); // pin
  const exp = expressions[zimelia.expression];
  pctx.fillStyle = '#000';
  pctx.fillRect(22, 24, 6, 6);
  pctx.fillRect(36, 24, 6, 6);
  if (exp.mouth === 'smile') pctx.fillRect(26, 36, 12, 3);
  pctx.fillStyle = '#6b2d5c';
  pctx.fillRect(18, 44, 28, 16); // jacket
}

// ==================== GAME LOOP ====================
let lastTime = 0;
function gameLoop(timestamp) {
  if (gameState !== 'playing' && gameState !== 'dialogue') {
    requestAnimationFrame(gameLoop);
    return;
  }
  const dt = timestamp - lastTime;
  lastTime = timestamp;

  if (gameState === 'playing') {
    updatePlayer();
    updateZimelia(dt);
    updateTime();
  }

  // Render
  ctx.clearRect(0,0,800,600);
  drawHouse();
  drawCharacter(player, false);
  drawCharacter(zimelia, true);

  // Interaction prompt
  const prompt = document.getElementById('prompt');
  let near = false;
  if (distance(player, zimelia) < 40) near = true;
  for (let f of furniture) {
    if (Math.abs(player.x + player.w/2 - (f.x + f.w/2)) < 35 && Math.abs(player.y + player.h/2 - (f.y + f.h/2)) < 35) near = true;
  }
  prompt.style.display = near && gameState === 'playing' ? 'block' : 'none';
  if (near) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = rect.width / 800;
    const scaleY = rect.height / 600;
    prompt.style.left = (rect.left + (player.x + 20) * scaleX) + 'px';
    prompt.style.top = (rect.top + (player.y - 10) * scaleY) + 'px';
  }

  requestAnimationFrame(gameLoop);
}

// ==================== UI & CONTROLS ====================
function startGame() {
  document.getElementById('titleScreen').style.display = 'none';
  canvas.style.display = 'block';
  gameState = 'playing';
  initAudio();
  updateTime();
  chooseAction();
  if (window.innerWidth < 800) {
    document.getElementById('mobileControls').style.display = 'block';
    document.getElementById('interactBtn').style.display = 'block';
  }
  requestAnimationFrame(gameLoop);
}

function showSettings() {
  document.getElementById('settings').style.display = 'flex';
}
function closeSettings() {
  document.getElementById('settings').style.display = 'none';
}
function toggleSound() {
  soundEnabled = document.getElementById('soundToggle').checked;
  document.getElementById('soundStatus').textContent = 'Sound: ' + (soundEnabled ? 'On' : 'Off');
}
function resumeGame() {
  document.getElementById('pauseMenu').style.display = 'none';
  gameState = 'playing';
}

document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'e' || e.key === 'E') interact();
  if (e.key === 'Escape') {
    if (gameState === 'dialogue') closeDialogue();
    else if (gameState === 'playing') {
      gameState = 'paused';
      document.getElementById('pauseMenu').style.display = 'flex';
    } else if (gameState === 'paused') resumeGame();
  }
});
document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function setKey(k, v) { keys[k] = v; }

// Handle resize
window.addEventListener('resize', () => {
  // simple scale for smaller screens
  const scale = Math.min(window.innerWidth / 800, window.innerHeight / 600, 1);
  canvas.style.transform = `scale(${scale})`;
});

// Initial
document.getElementById('soundToggle').checked = true;
</script>
