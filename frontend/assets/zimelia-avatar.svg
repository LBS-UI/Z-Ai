<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#3C2A63" />
      <stop offset="100%" stop-color="#1B1330" />
    </radialGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#332738" />
      <stop offset="100%" stop-color="#241C2C" />
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9D6FFF" />
      <stop offset="100%" stop-color="#6C4FD9" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#bgGlow)" />

  <!-- back hair -->
  <path d="M45 95 C40 150 55 180 100 182 C145 180 160 150 155 95 C155 55 132 34 100 34 C68 34 45 55 45 95 Z" fill="url(#hairGrad)" />

  <!-- jacket / shoulders -->
  <path d="M38 200 C40 160 65 142 100 142 C135 142 160 160 162 200 Z" fill="url(#jacketGrad)" />
  <path d="M38 200 C40 168 55 150 72 145 L82 200 Z" fill="#7C5CE0" opacity="0.55" />
  <path d="M162 200 C160 168 145 150 128 145 L118 200 Z" fill="#5A3FC4" opacity="0.55" />
  <!-- collar accents (green + amber) -->
  <path d="M92 143 L100 156 L108 143 Z" fill="#6FE3A5" />
  <circle cx="100" cy="150" r="3.4" fill="#FFC15E" />

  <!-- face -->
  <ellipse cx="100" cy="100" rx="46" ry="48" fill="#FFDCB8" />

  <!-- ears -->
  <ellipse cx="54" cy="102" rx="6" ry="9" fill="#FFDCB8" />
  <ellipse cx="146" cy="102" rx="6" ry="9" fill="#FFDCB8" />

  <!-- front hair / fringe -->
  <path d="M50 92 C48 60 68 38 100 38 C132 38 152 60 150 92
           C142 78 128 70 116 74 C108 66 92 66 84 74
           C72 70 58 78 50 92 Z" fill="url(#hairGrad)" />
  <!-- side locks -->
  <path d="M48 90 C44 118 46 142 56 160 C50 138 50 112 54 92 Z" fill="url(#hairGrad)" />
  <path d="M152 90 C156 118 154 142 144 160 C150 138 150 112 146 92 Z" fill="url(#hairGrad)" />
  <!-- subtle brown highlight streaks -->
  <path d="M70 46 C64 60 62 76 66 90" stroke="#7A5A52" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />
  <path d="M132 48 C138 62 140 78 136 90" stroke="#7A5A52" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />

  <!-- green hair pin -->
  <g transform="translate(122 62) rotate(18)">
    <rect x="-3" y="-11" width="6" height="22" rx="3" fill="#4FCB88" />
    <circle cx="0" cy="-11" r="4.5" fill="#6FE3A5" />
  </g>

  <!-- glasses -->
  <g stroke="#F6F3FF" stroke-width="3" fill="none" opacity="0.9">
    <circle cx="82" cy="102" r="15" />
    <circle cx="118" cy="102" r="15" />
    <line x1="97" y1="100" x2="103" y2="100" />
    <line x1="67" y1="100" x2="60" y2="98" />
    <line x1="133" y1="100" x2="140" y2="98" />
  </g>

  <!-- eyes (amber) -->
  <circle cx="82" cy="103" r="6" fill="#FFC15E" />
  <circle cx="118" cy="103" r="6" fill="#FFC15E" />
  <circle cx="84" cy="101" r="1.6" fill="#3B2410" />
  <circle cx="120" cy="101" r="1.6" fill="#3B2410" />

  <!-- blush -->
  <ellipse cx="70" cy="118" rx="7" ry="4" fill="#FFB6A0" opacity="0.55" />
  <ellipse cx="130" cy="118" rx="7" ry="4" fill="#FFB6A0" opacity="0.55" />

  <!-- warm smile -->
  <path d="M88 122 Q100 132 112 122" stroke="#7A4A3A" stroke-width="3" fill="none" stroke-linecap="round" />
</svg>
